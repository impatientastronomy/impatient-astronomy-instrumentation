# Camera configuration
#
# cal_path: root folder for calibration files (darks/, flats/, DPC/ subfolders).
#
# models: gain/offset defaults keyed by the model name string reported by the SDK.
#   Run list_cameras() to see the exact model string for your hardware.
#
# cameras: per-camera settings keyed by camera_id (the integer written to EEPROM).
#   pattern: Bayer demosaic pattern after any flips — RGGB, BGGR, GRBG, or GBRG.
#            Omit for mono cameras.
#   flip:    NONE, HORIZ, VERT, or BOTH.

cal_path: /Users/jasonhome/Local Astro/Cals/ImpatientAstronomy

models:
  ZWO ASI1600MM Pro:
    gain: 139
    offset: 21

cameras:
  # Example — fill in pattern/flip for each of your physical cameras.
   3:
     pattern: RGGB
     flip: NONE
