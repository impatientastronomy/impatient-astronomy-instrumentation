# Digital_eyepiece configuration
#

# Default location, used if system is unable to determine location
latitude: 38.44  
longitude: -122.71 

# Filter number is encoded in filenames and camera metadata. Modify for your purposes. 
# These do not need to be in numerical order. First one is default.
filters:
  0: none
  1: luminance
  2: UHC
  3: Ha
  4: SII
  5: OIII

# Path to camera calibration data
# This path should have the following subfolders: Darks, Flats, DPC

# Each Dark folder contains UINT16 images at various combinations of camera, exposure time, temperature, and bin
# Optionally Darks and  may contain other subfolders if, for example, dark frames were recorded on different dates

# Each Flats folder contains UINT16 images at various combinations of camera, filter, and bin.
# Each file is an image with per-pixel scaling, normalized to 1000, intended to adjust raw images for shading and nonuniformity.
# Optionally, Flats may contain subfolders for different telescopes.

# Each DPC folder contains binary images indicating especially bright, unstable, or troublesome pixels.
# Folder setup and naming is otherwise same as the Dark folder.
cal_path: /Users/jasonhome/Local Astro/ImpatientAstronomy/Cals
record_path: /Users/jasonhome/Local Astro/ImpatientAstronomy/Sessions

# Path where saved eyepiece images (JPEG) are written.
# Rename this folder manually to archive a night; the next Save recreates it.
image_path: ~/images/current

# Hotspot served on the second WiFi interface (wlan1) for guest image sharing.
# Run utilities/setup_hotspot.sh once to configure the Pi.
# Print the QR code with: uv run python utilities/print_qr.py
hotspot:
  ssid: AstroEye
  password: stargazer
  interface: wlan1
  ip: 192.168.10.1
  port: 8080

# Eyepiece may be connected to one or more cameras, listed according to ID, which is stored in camera EEPROM.
# IDs do not need to be in numeric order. 

preferred_camera_id: 3 # If multiple cameras are connected, the system will display this one first
# if camera ID is not found or has not been set, the first camera id and config is used.
max_zoom: 5 # Maximum digital zoom factor (scroll-wheel zoom)
cameras:
  primary: # the descriptive name of this camera
    # Camera parameters
    id: 3
    gain: 139 # Camera gain
    data_offset: 21 # Moves readout values above zero to avoid clipping
    # flip affects the order of sensor readout
    flip: 0 # 0-3, corresponding to NONE, HORIZ, VERT, or BOTH
    # pattern is the demosic code applied in processing, which may be different from the physical sensor
    pattern: GBRG # NONE, RGGB, BGGR, GRBG, or GBRG
    bin: 1
    cam_size: [3520,3520] # width and height of readout. if -1, will use sensor max
    cam_offset: [-1, -1] # Starting [x,y] readout position. zero indexed. Auto center if -1
    # Telescope parameters
    telescope_description: Vixen_600mm 
    focal_length_mm: 600 # You may need to tweak this if the map overlay doesn't match
    mount_driver: zwo_am5 # Must match the python module name for connecting to the mount 
    mount_type: Alt-Az # Must be Alt-Az or Equatorial
    # Display parameters
    image_offset: [0, 0] # [x,y], display pixels, shifts the displayed image to align with visual field or other camera
    image_scale: 1 # >1 to zoom into the image. <1 will result in black border around displayed image
    image_rotation: 0 # Nominally set to or near zero. Big rotations are more efficiently handled with flip.
    # Overlay parameters
    overlay_style: style1 # see overlay_style.yaml for style definition
    overlay_offset: [0, 0] #[x,y], display pixels, shifts overlay to match image
    overlay_scale: 1 # Typically 1. If not 1, indicates error in focal_length_mm
    overlay_rotation: 0 # Typically set to zero
    overlay_flip: 0 # map overlay, 0-3, corresponding to NONE, HORIZ, VERT, or BOTH
  # If multiple cameras connected, copy per above, and paste below this line
  #
sky_map: # Enables a wide-angle sky map overlay
  map_fov: [10, 20, 60] # [min, default, max] horz and vert field of view in degrees

    



