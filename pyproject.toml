[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrocore"
version = "0.1.0"
description = "Shared library for impatient-astronomy-instrumentation projects"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "opencv-python-headless>=4",
    "pandas>=2",
    "pygame>=2",
    "PyYAML>=6",
    "tifffile>=2024",
    "zwoasi>=0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["astrocore*", "digital_eyepiece*"]

[dependency-groups]
dev = [
    "pytest>=9",
]

[tool.pytest.ini_options]
markers = [
    "hardware: tests that require a physical camera connected via USB",
]
